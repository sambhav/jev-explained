<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Responsive preview · Jev Explained</title><style>body{margin:0;background:#253449;color:#fff;font:14px system-ui}header{padding:12px;display:flex;flex-wrap:wrap;gap:14px;align-items:center}select,button{font:inherit;padding:8px}iframe{border:0;background:#0b1220;height:1100px;display:block;margin:0 auto;max-width:none}label{display:flex;align-items:center;gap:8px}</style></head><body><header><label>Page<select id="page"><option>index.html</option><option>agents.html</option><option>architecture.html</option><option>benchmarks.html</option><option>economics.html</option><option>patterns.html</option><option>browser.html</option><option>gaming.html</option><option>emerging.html</option></select></label><label>Viewport<select id="width"><option value="390">Mobile · 390px</option><option value="320">Narrow · 320px</option><option value="768">Tablet · 768px</option><option value="1100">Desktop · 1100px</option></select></label><button id="reload">Reload page</button><span>Development preview · each page uses its normal scripts.</span></header><iframe title="Site preview" src="../index.html" style="width:390px"></iframe><script>const frame=document.querySelector('iframe');document.querySelector('#page').onchange=e=>frame.src='../'+e.target.value;document.querySelector('#width').onchange=e=>frame.style.width=e.target.value+'px';document.querySelector('#reload').onclick=()=>frame.src='../'+document.querySelector('#page').value;</script></body></html>
